<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinguim Flashcards - Fato ou Mentira?</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        ice: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Perspective for 3D flip card effect */
        .perspective-1000 {
            perspective: 1000px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card-inner.is-flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1.25rem;
            cursor: pointer;
            user-select: none;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        /* Custom Snowfall animation */
        .snowflake {
            position: fixed;
            top: -10px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 1em;
            pointer-events: none;
            z-index: 0;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }

        /* Mascot wobble animation */
        @keyframes waddle {
            0%, 100% { transform: rotate(-5deg) translateY(0); }
            50% { transform: rotate(5deg) translateY(-4px); }
        }

        .animate-waddle {
            animation: waddle 1.5s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans selection:bg-sky-500 selection:text-white flex flex-col min-h-screen">

    <!-- Snowfall container -->
    <div id="snowflake-container"></div>

    <!-- Header section -->
    <header class="relative z-10 pt-8 pb-4 px-4 text-center">
        <div class="max-w-4xl mx-auto flex flex-col items-center justify-center">
            
            <!-- Animated SVG Penguin Icon -->
            <div class="w-20 h-20 mb-3 bg-sky-500/10 rounded-full p-2 border-2 border-sky-400/30 shadow-lg shadow-sky-500/20 animate-waddle cursor-pointer" onclick="playPenguinSound()">
                <svg viewBox="0 0 100 100" class="w-full h-full text-sky-400">
                    <!-- Penguin body -->
                    <ellipse cx="50" cy="55" rx="30" ry="35" fill="#1e293b"/>
                    <!-- Belly -->
                    <ellipse cx="50" cy="58" rx="20" ry="26" fill="#f8fafc"/>
                    <!-- Eyes -->
                    <circle cx="42" cy="38" r="4" fill="#ffffff"/>
                    <circle cx="42" cy="38" r="2" fill="#0284c7"/>
                    <circle cx="58" cy="38" r="4" fill="#ffffff"/>
                    <circle cx="58" cy="38" r="2" fill="#0284c7"/>
                    <!-- Beak -->
                    <polygon points="50,42 43,49 57,49" fill="#f59e0b"/>
                    <!-- Feet -->
                    <ellipse cx="38" cy="88" rx="8" ry="4" fill="#f59e0b"/>
                    <ellipse cx="62" cy="88" rx="8" ry="4" fill="#f59e0b"/>
                    <!-- Wings -->
                    <ellipse cx="20" cy="55" rx="6" ry="18" fill="#0f172a" transform="rotate(20 20 55)"/>
                    <ellipse cx="80" cy="55" rx="6" ry="18" fill="#0f172a" transform="rotate(-20 80 55)"/>
                </svg>
            </div>

            <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight bg-gradient-to-r from-sky-300 via-sky-100 to-indigo-300 bg-clip-text text-transparent mb-2">
                Pinguim Flashcards 🐧
            </h1>
            <p class="text-sky-200/80 text-sm sm:text-base max-w-xl">
                Descubra o mundo dos pinguins! Clique em <strong class="text-emerald-400">Verdadeiro</strong> ou <strong class="text-rose-400">Falso</strong> em cada cartão para testar seu conhecimento.
            </p>

            <!-- Score and Progress Bar -->
            <div class="w-full max-w-xl bg-slate-900/80 backdrop-blur border border-slate-800 rounded-2xl p-4 mt-6 shadow-xl">
                <div class="flex justify-between items-center text-xs sm:text-sm font-semibold mb-2">
                    <span class="text-slate-400">Progresso dos Desafios: <span id="progress-text" class="text-sky-400">0 / 8</span></span>
                    <div class="flex space-x-4">
                        <span class="text-emerald-400"><i class="fa-solid fa-circle-check mr-1"></i> Acertos: <span id="score-correct">0</span></span>
                        <span class="text-rose-400"><i class="fa-solid fa-circle-xmark mr-1"></i> Erros: <span id="score-wrong">0</span></span>
                    </div>
                </div>
                <!-- Progress Bar track -->
                <div class="w-full bg-slate-800 rounded-full h-3 overflow-hidden p-0.5 border border-slate-700">
                    <div id="progress-bar" class="bg-gradient-to-r from-sky-500 to-indigo-500 h-full rounded-full w-0 transition-all duration-500"></div>
                </div>
            </div>

            <!-- Controls bar -->
            <div class="flex items-center gap-3 mt-4">
                <button onclick="resetAllCards()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-sky-300 text-xs sm:text-sm font-semibold rounded-xl border border-sky-500/20 shadow transition active:scale-95 flex items-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i> Reiniciar Tudo
                </button>
                <button onclick="toggleAudio()" id="audio-btn" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs sm:text-sm font-semibold rounded-xl border border-slate-700 shadow transition active:scale-95 flex items-center gap-2">
                    <i class="fa-solid fa-volume-high" id="audio-icon"></i> Som: On
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="relative z-10 flex-grow max-w-7xl mx-auto px-4 py-6 w-full">
        <!-- 8 Flashcard Grid -->
        <div id="flashcards-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Cards will be dynamically generated by JavaScript -->
        </div>
    </main>

    <footer class="relative z-10 border-t border-slate-800/80 bg-slate-950/60 backdrop-blur py-4 text-center text-xs text-slate-500">
        <p>Desenvolvido com <i class="fa-solid fa-heart text-rose-500"></i> para os amantes da vida marinha. 🐧❄️</p>
    </footer>

    <script>
        // Audio state
        let soundEnabled = true;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                    osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.15); // E5
                    osc.frequency.exponentialRampToValueAtTime(783.99, audioCtx.currentTime + 0.3); // G5
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.35);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, audioCtx.currentTime); // A3
                    osc.frequency.exponentialRampToValueAtTime(164.81, audioCtx.currentTime + 0.25); // E3
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'squeak') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.15);
                }
            } catch (e) {
                console.log("Audio not allowed yet");
            }
        }

        function playPenguinSound() {
            playSound('squeak');
        }

        function toggleAudio() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('audio-icon');
            const btn = document.getElementById('audio-btn');
            if (soundEnabled) {
                icon.className = 'fa-solid fa-volume-high';
                btn.innerHTML = `<i class="fa-solid fa-volume-high"></i> Som: On`;
            } else {
                icon.className = 'fa-solid fa-volume-xmark';
                btn.innerHTML = `<i class="fa-solid fa-volume-xmark"></i> Som: Off`;
            }
        }

        // Data for 8 Penguin Flashcards
        const flashcardsData = [
            {
                id: 1,
                tag: "Habitat & Geografia",
                statement: "Os pinguins vivem apenas no Polo Norte e convivem diariamente com ursos-polares no gelo.",
                isTrue: false,
                factCorrection: "É MENTIRA! Os pinguins vivem quase exclusivamente no Hemisfério Sul (Antártida, América do Sul, África e Oceania). Eles NUNCA encontram ursos-polares, pois estes vivem no Polo Norte!"
            },
            {
                id: 2,
                tag: "Espécies & Tamanho",
                statement: "O Pinguim-Imperador é a maior espécie do mundo, podendo passar de 1,20 metro de altura.",
                isTrue: true,
                factCorrection: "TÁ CERTA! O Pinguim-Imperador é verdadeiramente o gigante da família, podendo ultrapassar 1,20m de altura e pesar mais de 40 kg!"
            },
            {
                id: 3,
                tag: "Habilidade de Voo",
                statement: "Os pinguins usam suas asas para voar pelo ar quando precisam fugir rapidamente de predadores.",
                isTrue: false,
                factCorrection: "É MENTIRA! Pinguins não conseguem voar no ar. Suas asas evoluíram para se tornarem nadadeiras rígidas e fortes para 'voar' em alta velocidade dentro da água!"
            },
            {
                id: 4,
                tag: "Cuidados Paternos",
                statement: "Em várias espécies de pinguins, é o pai (macho) quem choca o ovo durante o inverno rigoroso.",
                isTrue: true,
                factCorrection: "TÁ CERTA! No Pinguim-Imperador, o pai equilibra o ovo em cima dos pés cobertos por uma dobra de pele aquecida por até 2 meses sem comer, enquanto a mãe caça!"
            },
            {
                id: 5,
                tag: "Alimentação & Hidratação",
                statement: "Os pinguins bebem apenas água doce e podem morrer de intoxicação se ingerirem água salgada do mar.",
                isTrue: false,
                factCorrection: "É MENTIRA! Pinguins têm uma glândula supraorbital especial acima dos olhos que filtra todo o sal da água do mar e o expulsa em gotas pelo bico!"
            },
            {
                id: 6,
                tag: "Pinguim Tropical",
                statement: "O Pinguim-de-Galápagos é a única espécie que vive na linha do Equador em um clima quente.",
                isTrue: true,
                factCorrection: "TÁ CERTA! É a única espécie de pinguim que vive no Equador! Eles conseguem sobreviver graças às correntes marítimas frias que chegam ao arquipélago."
            },
            {
                id: 7,
                tag: "Anatomia",
                statement: "Os pinguins possuem dentes bem afiados na boca para mastigar peixes antes de engolir.",
                isTrue: false,
                factCorrection: "É MENTIRA! Pinguins NÃO têm dentes! Em vez disso, têm espinhos queratinizados voltados para trás na língua e no céu da boca para segurar presas e engoli-las inteiras!"
            },
            {
                id: 8,
                tag: "Camuflagem",
                statement: "A clássica cor preta e branca do pinguim serve como camuflagem vital dentro do oceano.",
                isTrue: true,
                factCorrection: "TÁ CERTA! Chama-se contrassombra: vista de cima, as costas pretas se confundem com as profundezas do mar. Vista de baixo, a barriga branca se confunde com a luz do sol na superfície!"
            }
        ];

        // Track state of cards
        let userAnswers = {}; // id: { answered: boolean, userChoice: boolean, isCorrect: boolean }

        function renderCards() {
            const grid = document.getElementById('flashcards-grid');
            grid.innerHTML = '';

            flashcardsData.forEach((card, index) => {
                const answerState = userAnswers[card.id];
                const isFlipped = answerState && answerState.answered;

                let feedbackBadgeHTML = '';
                let resultMessageHTML = '';

                if (isFlipped) {
                    if (answerState.isCorrect) {
                        feedbackBadgeHTML = `
                            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 text-xs font-bold mb-2">
                                <i class="fa-solid fa-circle-check"></i> Você Acertou! (Tá certa)
                            </div>`;
                    } else {
                        feedbackBadgeHTML = `
                            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/40 text-xs font-bold mb-2">
                                <i class="fa-solid fa-circle-xmark"></i> Você Errou!
                            </div>`;
                    }

                    // Answer description formulation based on statement truth
                    if (card.isTrue) {
                        resultMessageHTML = `
                            <div class="bg-emerald-950/60 border border-emerald-500/30 rounded-xl p-3 text-xs sm:text-sm text-emerald-200">
                                <p class="font-bold text-emerald-300 mb-1">
                                    <i class="fa-solid fa-check mr-1"></i> A afirmação está CERTA!
                                </p>
                                <p class="text-slate-200 leading-relaxed">${card.factCorrection}</p>
                            </div>`;
                    } else {
                        resultMessageHTML = `
                            <div class="bg-rose-950/60 border border-rose-500/30 rounded-xl p-3 text-xs sm:text-sm text-rose-200">
                                <p class="font-bold text-rose-300 mb-1">
                                    <i class="fa-solid fa-triangle-exclamation mr-1"></i> É MENTIRA!
                                </p>
                                <p class="text-slate-200 leading-relaxed">${card.factCorrection}</p>
                            </div>`;
                    }
                }

                const cardEl = document.createElement('div');
                cardEl.className = 'perspective-1000 h-[380px] w-full';
                cardEl.innerHTML = `
                    <div class="card-inner ${isFlipped ? 'is-flipped' : ''}" id="card-inner-${card.id}">
                        
                        <!-- CARD FRONT (Clickable anywhere) -->
                        <div onclick="flipCardDirectly(${card.id})" class="card-front bg-slate-900/90 border border-slate-800 hover:border-sky-400 hover:shadow-sky-500/10 transition-all duration-300 shadow-xl p-5 flex flex-col justify-between backdrop-blur">
                            <div>
                                <!-- Header badge -->
                                <div class="flex justify-between items-center mb-3">
                                    <span class="px-2.5 py-1 rounded-lg bg-sky-500/10 border border-sky-500/20 text-sky-300 text-[11px] font-semibold tracking-wide">
                                        Card #${index + 1} • ${card.tag}
                                    </span>
                                    <span class="text-slate-500 text-xs font-mono"><i class="fa-solid fa-hand-pointer mr-1"></i>Clique para virar</span>
                                </div>

                                <!-- Card Title / Statement -->
                                <div class="mt-3">
                                    <h3 class="text-xs uppercase tracking-wider font-extrabold text-slate-400 mb-2">Afirmação:</h3>
                                    <p class="text-slate-100 text-sm sm:text-base font-medium leading-snug bg-slate-800/50 p-4 rounded-xl border border-slate-700/50 min-h-[120px] flex items-center">
                                        "${card.statement}"
                                    </p>
                                </div>
                            </div>

                            <!-- Buttons Front -->
                            <div>
                                <p class="text-center text-xs text-slate-400 mb-3 font-semibold">Qual é o seu palpite?</p>
                                <div class="grid grid-cols-2 gap-3">
                                    <button onclick="event.stopPropagation(); submitAnswer(${card.id}, true)" class="py-2.5 px-3 bg-emerald-600/20 hover:bg-emerald-600/40 text-emerald-300 border border-emerald-500/40 hover:border-emerald-400 rounded-xl font-bold text-xs sm:text-sm transition-all duration-200 flex items-center justify-center gap-1.5 shadow active:scale-95">
                                        <i class="fa-solid fa-check"></i> Verdadeiro
                                    </button>
                                    <button onclick="event.stopPropagation(); submitAnswer(${card.id}, false)" class="py-2.5 px-3 bg-rose-600/20 hover:bg-rose-600/40 text-rose-300 border border-rose-500/40 hover:border-rose-400 rounded-xl font-bold text-xs sm:text-sm transition-all duration-200 flex items-center justify-center gap-1.5 shadow active:scale-95">
                                        <i class="fa-solid fa-xmark"></i> Falso
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- CARD BACK (Click anywhere to turn back) -->
                        <div onclick="resetSingleCard(${card.id})" class="card-back bg-slate-900 border border-slate-700 shadow-2xl p-5 flex flex-col justify-between backdrop-blur">
                            <div>
                                <div class="text-center mb-2">
                                    ${feedbackBadgeHTML}
                                </div>

                                <div class="mt-1">
                                    ${resultMessageHTML}
                                </div>
                            </div>

                            <!-- Flip back button -->
                            <div class="mt-3">
                                <button onclick="event.stopPropagation(); resetSingleCard(${card.id})" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold border border-slate-700 transition flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-arrows-rotate"></i> Tentar Novamente
                                </button>
                            </div>
                        </div>

                    </div>
                `;
                grid.appendChild(cardEl);
            });

            updateScoreboard();
        }

        // Direct flip when clicking anywhere on card front
        function flipCardDirectly(cardId) {
            const card = flashcardsData.find(c => c.id === cardId);
            if (!card) return;
            
            // If user clicks the card without selecting True/False, reveal fact directly
            submitAnswer(cardId, card.isTrue);
        }

        function submitAnswer(cardId, userChoice) {
            const card = flashcardsData.find(c => c.id === cardId);
            if (!card) return;

            const isCorrect = (userChoice === card.isTrue);
            userAnswers[cardId] = {
                answered: true,
                userChoice: userChoice,
                isCorrect: isCorrect
            };

            playSound(isCorrect ? 'correct' : 'wrong');

            // Trigger card flip
            const cardInner = document.getElementById(`card-inner-${cardId}`);
            if (cardInner) {
                cardInner.classList.add('is-flipped');
            }

            // Re-render briefly after animation finishes to show correct state styling if needed
            setTimeout(() => {
                renderCards();
                checkGameCompletion();
            }, 300);
        }

        function resetSingleCard(cardId) {
            delete userAnswers[cardId];
            playSound('squeak');
            renderCards();
        }

        function resetAllCards() {
            userAnswers = {};
            playSound('squeak');
            renderCards();
        }

        function updateScoreboard() {
            const answeredKeys = Object.keys(userAnswers);
            const totalAnswered = answeredKeys.length;
            let correctCount = 0;
            let wrongCount = 0;

            answeredKeys.forEach(key => {
                if (userAnswers[key].isCorrect) {
                    correctCount++;
                } else {
                    wrongCount++;
                }
            });

            document.getElementById('progress-text').innerText = `${totalAnswered} / ${flashcardsData.length}`;
            document.getElementById('score-correct').innerText = correctCount;
            document.getElementById('score-wrong').innerText = wrongCount;

            const percent = (totalAnswered / flashcardsData.length) * 100;
            document.getElementById('progress-bar').style.width = `${percent}%`;
        }

        function checkGameCompletion() {
            const totalAnswered = Object.keys(userAnswers).length;
            if (totalAnswered === flashcardsData.length) {
                // Trigger celebratory confetti
                try {
                    confetti({
                        particleCount: 100,
                        spread: 70,
                        origin: { y: 0.6 }
                    });
                } catch(e){}
            }
        }

        function createSnowflakes() {
            const container = document.getElementById('snowflake-container');
            const flakeChars = ['❄', '❅', '❆', '•'];
            
            for (let i = 0; i < 25; i++) {
                const flake = document.createElement('div');
                flake.className = 'snowflake';
                flake.innerText = flakeChars[Math.floor(Math.random() * flakeChars.length)];
                flake.style.left = Math.random() * 100 + 'vw';
                flake.style.animationDuration = (Math.random() * 5 + 5) + 's';
                flake.style.animationDelay = (Math.random() * 5) + 's';
                flake.style.fontSize = (Math.random() * 10 + 10) + 'px';
                flake.style.opacity = Math.random() * 0.5 + 0.2;
                container.appendChild(flake);
            }
        }

        // Initialize on window load
        window.onload = function() {
            createSnowflakes();
            renderCards();
        };
    </script>
</body>
</html>
